[project]
name = "com-council-backend"
version = "1.0.0"
description = "Council of Minds — multi-agent deliberation backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    "litellm>=1.50",
    "chromadb>=0.5",
    "neo4j>=5.0",
    "redis>=5.0",
    "celery>=5.4",
    "sentence-transformers>=3.0",
    "python-multipart>=0.0.12",
    "structlog>=24.0",
    "httpx>=0.28",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.0",
    "httpx>=0.28",
    "watchfiles>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
