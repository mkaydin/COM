<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Council of Minds - Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="styles.css" rel="stylesheet"/>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "obsidian": "#1a1a2e",
          "background": "#141315",
          "parchment": "#e8d5b7",
          "runed-gold": "#ffd700",
          "spectral-blue": "#87ceeb",
          "ember-glow": "#ff6b6b",
          "success": "#27ae60",
          "error": "#c0392b"
        },
        fontFamily: {
          "pixel-display": ["VT323", "monospace"],
          "pixel-body": ["VT323", "monospace"]
        }
      }
    }
  };
</script>
<script src="api.js"></script>
<style>
  body { background-color: #1a1a2e; }
  .pixel-text { font-family: "VT323", monospace; }
</style>
</head>
<body class="bg-obsidian min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md" id="app">
  <div class="text-center mb-8">
    <h1 class="text-amber-400 text-3xl pixel-text mb-2">COUNCIL OF MINDS</h1>
    <p class="text-parchment text-base pixel-text opacity-70">First-Run Configuration</p>
  </div>

  <div id="step-model" class="bg-[#201f21] border border-[#353436] rounded p-6">
    <h2 class="text-amber-400 text-xl pixel-text mb-4">Local Model</h2>
    <p class="text-parchment text-sm pixel-text mb-4 opacity-70">
      The Council runs entirely on a local Ollama server. Nothing leaves this machine.
    </p>

    <label class="text-parchment text-sm pixel-text mb-1 block">Model tag</label>
    <input id="model-input" type="text" class="w-full bg-obsidian border border-[#353436] text-parchment pixel-text p-3 rounded mb-2" value="gemma4:e4b" placeholder="e.g. gemma4:e4b"/>
    <p class="text-parchment text-xs pixel-text opacity-50 mb-4">Must be pulled first: <code>ollama pull gemma4:e4b</code></p>

    <div id="model-list" class="text-parchment text-xs pixel-text opacity-60 mb-6"></div>

    <button onclick="testConnection()" class="w-full bg-amber-400 text-obsidian pixel-text text-lg py-3 rounded hover:bg-amber-300 transition-colors">Test &amp; Save</button>
  </div>

  <div id="step-status" class="bg-[#201f21] border border-[#353436] rounded p-6 hidden">
    <h2 class="text-amber-400 text-xl pixel-text mb-4">Checking Setup...</h2>
    <div id="status-message" class="text-parchment pixel-text mb-4">Testing connection...</div>
    <div id="status-spinner" class="flex justify-center mb-4">
      <div class="animate-spin rounded-full h-8 w-8 border-2 border-amber-400 border-t-transparent"></div>
    </div>
    <button id="btn-enter" onclick="enterCouncil()" class="w-full bg-success text-white pixel-text text-lg py-3 rounded hover:opacity-90 transition-opacity hidden">Enter the Council</button>
    <button onclick="backToModelStep()" class="w-full border border-[#353436] text-parchment pixel-text py-3 rounded mt-3 hidden" id="btn-retry">Change Model</button>
  </div>

  <p class="text-center text-parchment text-xs pixel-text opacity-40 mt-8">Council of Minds v1.0 · All configuration stays local</p>
</div>

<script>
  const DEFAULT_MODEL = 'gemma4:e4b';

  function backToModelStep() {
    document.getElementById('step-model').classList.remove('hidden');
    document.getElementById('step-status').classList.add('hidden');
    loadInstalledModels();
  }

  async function loadInstalledModels() {
    const el = document.getElementById('model-list');
    if (!el) return;
    try {
      const res = await fetch(`${window.COM_API_BASE}/api/ollama/status`);
      if (!res.ok) throw new Error(res.status);
      const st = await res.json();
      if (!st.reachable) {
        el.innerHTML = '<span class="text-error">Ollama is not reachable. Start it with <code>ollama serve</code>.</span>';
      } else {
        el.textContent = st.installed.length
          ? 'Installed: ' + st.installed.join(', ')
          : 'No models installed yet.';
      }
    } catch (e) {
      el.textContent = 'Could not reach the backend yet — is it starting?';
    }
  }
  loadInstalledModels();

  async function testConnection() {
    const model = document.getElementById('model-input').value.trim() || DEFAULT_MODEL;
    document.getElementById('step-model').classList.add('hidden');
    document.getElementById('step-status').classList.remove('hidden');
    document.getElementById('status-spinner').classList.remove('hidden');
    document.getElementById('status-message').textContent = 'Checking model ' + model + '...';
    document.getElementById('btn-enter').classList.add('hidden');
    document.getElementById('btn-retry').classList.add('hidden');

    try {
      await window.electronAPI.saveBackendConfig({ llmModel: model });
      await new Promise(r => setTimeout(r, 2000));
      if (!await window.electronAPI.isBackendReady()) throw new Error('Backend did not become ready');

      const st = await fetch(`${window.COM_API_BASE}/api/ollama/status`).then(r => r.json());
      if (!st.model_present) throw new Error(`Model '${model}' is not installed. Run: ollama pull ${model}`);

      document.getElementById('status-spinner').classList.add('hidden');
      document.getElementById('status-message').innerHTML =
        '<span class="text-success">Ready.</span><br/><span class="opacity-70">Model: ' + model + '</span>';
      document.getElementById('btn-enter').classList.remove('hidden');
    } catch (e) {
      document.getElementById('status-spinner').classList.add('hidden');
      document.getElementById('status-message').innerHTML =
        '<span class="text-error">Not ready</span><br/><span class="opacity-70">' + e.message + '</span>';
      backToModelStep();
      document.getElementById('btn-retry').classList.remove('hidden');
    }
  }

  function enterCouncil() {
    window.location.href = 'council_landing_page.html';
  }
</script>
</body></html>
