upstream com_backend {
    server backend:8734;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index council_landing_page.html;

    # The pages ship hand-written HTML/JS; nothing here is generated, so a
    # stale cache is always worse than a round trip.
    add_header Cache-Control "no-cache, must-revalidate";

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # REST
    location /api/ {
        proxy_pass http://com_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A forum run does several sequential LLM calls per round; the default
        # 60s read timeout cuts a legitimate long thread off mid-post.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebSocket — both the legacy chamber stream and the forum thread.
    location /ws/ {
        proxy_pass http://com_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # A thread lives for minutes. Without this nginx closes the socket at
        # 60s and the UI silently stops receiving posts.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = / {
        return 302 /forum.html;
    }
}